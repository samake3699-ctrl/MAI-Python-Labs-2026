
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "school-submission-lab"
version = "0.1.0"
description = "Student submission intake and validation system"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
namespaces = true

[project.scripts]
school-import = "src.school.cli:main"
